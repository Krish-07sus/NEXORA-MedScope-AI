<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="chat">

<div class="chatbox">

{% for role, msg in chat %}
<div class="{{ role }}">{{ msg }}</div>
{% endfor %}

<form action="/ask" method="post">
<input name="question" placeholder="Ask..." required>
<button>Send</button>
</form>

<a href="/result">Back</a>

</div>

</body>
</html>
